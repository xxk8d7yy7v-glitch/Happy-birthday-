<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Blossom Wish For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── HIGH-CONTRAST THEME PALETTES ── */
  /* Upgraded color variables to vibrant, luminous tones for premium readability over video */
  body.theme-sakura { 
    --pink-soft: #ff85c0; /* Vibrant Neon Blossom Pink */
    --gold: #ff2a8d;      /* Deep Radiant Rose */
  }
  body.theme-midnight { 
    --pink-soft: #bfa3ff; /* Luminous Lavender Electric */
    --gold: #00f0ff;      /* High-Visibility Cyan */
  }
  body.theme-gold { 
    --pink-soft: #ffe57f; /* Bright Sunflower Gold */
    --gold: #ff9100;      /* Vivid Electric Amber */
  }
  body.theme-ocean { 
    --pink-soft: #64ffda; /* High-Gloss Vivid Aquamarine */
    --gold: #00b0ff;      /* Bright Deep Sea Blue */
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Crimson Pro', serif;
    background-color: #0d0508;
    color: #fff;
  }

  /* ── BACKGROUND VIDEO CONTAINER ── */
  .video-container {
    position: fixed; 
    inset: 0;
    width: 100%; 
    height: 100%;
    z-index: 0;
    overflow: hidden;
  }

  video {
    width: 100%; 
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .video-overlay {
    position: absolute; 
    inset: 0;
    background: radial-gradient(circle at center, transparent 10%, rgba(13, 5, 8, 0.65) 95%);
    z-index: 1;
  }

  /* ── TEXT OVERLAY LAYOUT ── */
  .content-container {
    position: relative; 
    z-index: 10;
    width: 100%; 
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr; 
    padding: 60px;
    pointer-events: none; 
  }

  .text-column {
    grid-column: 2; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding-left: 40px;
  }

  /* Typography styling with deep geometric shadow stacks to maximize readability */
  .recipient-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(34px, 4.8vw, 50px);
    font-weight: 400;
    letter-spacing: 0.05em;
    margin-bottom: 28px;
    color: #ffffff;
    line-height: 1.2;
    min-height: 55px; 
    text-shadow: 
      0 2px 4px rgba(0, 0, 0, 0.9), 
      0 4px 12px rgba(0, 0, 0, 0.7),
      0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .recipient-title em {
    font-style: italic;
    color: var(--pink-soft);
    font-weight: 400;
  }

  .message-body {
    font-size: clamp(20px, 2.4vw, 26px);
    font-weight: 300;
    line-height: 1.8;
    color: #ffffff;
    margin-bottom: 40px;
    white-space: pre-wrap;
    max-width: 500px;
    min-height: 150px;
    text-shadow: 
      0 2px 4px rgba(0, 0, 0, 0.9), 
      0 4px 12px rgba(0, 0, 0, 0.7),
      0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .sender-signoff {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 0.15em;
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1s ease;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
  }

  .sender-signoff.show {
    opacity: 1;
  }

  .sender-signoff span {
    display: block;
    margin-top: 8px;
    font-family: 'Crimson Pro', serif;
    font-size: 28px;
    font-style: normal;
    color: var(--gold);
    letter-spacing: 0.02em;
    text-shadow: 
      0 2px 4px rgba(0, 0, 0, 0.9),
      0 4px 15px rgba(0, 0, 0, 0.6);
  }

  /* Blinking typewriter cursor indicator */
  .cursor {
    display: inline-block;
    width: 2.5px;
    height: 0.95em;
    background-color: var(--pink-soft);
    margin-left: 5px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
    box-shadow: 0 0 8px var(--pink-soft);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* Mobile Layout Adjustments */
  @media (max-width: 900px) {
    .content-container {
      grid-template-columns: 1fr;
      padding: 30px;
    }
    .text-column {
      grid-column: 1;
      padding-left: 0;
      justify-content: center; 
      padding: 10px;
    }
  }

  .audio-hint {
    position: absolute; bottom: 20px; left: 20px;
    z-index: 15; background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px; border-radius: 30px;
    font-size: 12px; font-weight: 200; cursor: pointer;
    letter-spacing: 0.05em; transition: 0.3s; pointer-events: auto;
    user-select: none;
  }
  .audio-hint:hover {
    background: rgba(255,255,255,0.15);
  }
</style>
</head>
<body class="theme-sakura">

<div class="video-container" id="video-window">
  <video id="bg-video" autoplay muted playsinline loop>
    <source src="Tree.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="video-overlay"></div>
</div>

<div class="audio-hint" id="audio-toggle" onclick="toggleMute()">🔇 Muted</div>

<div class="content-container">
  <div class="text-column">
    <h1 class="recipient-title" id="view-recipient"></h1>
    <p class="message-body" id="view-message"></p>
    <p class="sender-signoff" id="sender-container">With Love, <span id="view-sender"></span></p>
  </div>
</div>

<script>
let wishData = { recipient: "Someone", message: "A beautiful wish...", sender: "", theme: "sakura", occasion: "custom" };

// Unique greeting generator based directly on the created context occasion
function generateOccasionGreeting(occasion, name) {
  const cleanName = name || 'Someone';
  const greetings = {
    birthday: `Happy Birthday to the Wonderful ${cleanName},`,
    anniversary: `To My Dearest ${cleanName},`,
    graduation: `To the Inspiring ${cleanName},`,
    new_year: `Happy New Year to ${cleanName},`,
    love: `To My Beautiful Love, ${cleanName},`,
    friendship: `To My Amazing Friend, ${cleanName},`,
    farewell: `Wishing the Absolute Best to ${cleanName},`,
    custom: `To My Dearest ${cleanName},`
  };
  
  return greetings[occasion] || `To My Dearest ${cleanName},`;
}

// ── PARSE & DECODE LINK DATA ──
function loadData() {
  const urlParams = new URLSearchParams(window.location.search);
  const dataParam = urlParams.get('d');
  if (dataParam) {
    try {
      const binStr = atob(dataParam);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) {
        bytes[i] = binStr.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      wishData = JSON.parse(jsonStr);
      
      if (wishData.theme) {
        document.body.className = '';
        document.body.classList.add(`theme-${wishData.theme}`);
      }
    } catch (e) {
      console.error("Decoding error processing parameters", e);
    }
  }
}
loadData();

// Start the typewriter sequence exactly 6 seconds (6000ms) after DOM load
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    startTypingSequence();
  }, 6000);
});

// ── TYPEWRITER ENGINE ──
function typeText(element, text, speed, callback) {
  let index = 0;
  element.innerHTML = ""; 
  
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  element.appendChild(cursor);

  function type() {
    if (index < text.length) {
      cursor.insertAdjacentText('beforebegin', text.charAt(index));
      index++;
      setTimeout(type, speed);
    } else {
      cursor.remove(); 
      if (callback) callback();
    }
  }
  type();
}

function startTypingSequence() {
  const recipientTarget = document.getElementById('view-recipient');
  const messageTarget = document.getElementById('view-message');
  const senderTarget = document.getElementById('view-sender');
  const signoffBlock = document.getElementById('sender-container');

  // Dynamically generate customized title lines based on parameters
  const greetingText = generateOccasionGreeting(wishData.occasion, wishData.recipient);
  const bodyText = wishData.message || '';
  const signoffName = wishData.sender || '';

  typeText(recipientTarget, greetingText, 60, () => {
    typeText(messageTarget, bodyText, 40, () => {
      if (signoffName) {
        senderTarget.textContent = signoffName;
        signoffBlock.classList.add('show');
      }
    });
  });
}

// ── AUDIO HANDLER ──
function toggleMute() {
  const video = document.getElementById('bg-video');
  if (video.muted) {
    video.muted = false;
    document.getElementById('audio-toggle').textContent = "🔊 Audio On";
  } else {
    video.muted = true;
    document.getElementById('audio-toggle').textContent = "🔇 Muted";
  }
}
</script>
</body>
</html>
