<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blossom Wishes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Crimson+Pro:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Crimson Pro', serif;
    cursor:none;
  }

  /* ── CUSTOM CURSOR ── */
  #cursor {
    position:fixed; pointer-events:none; z-index:9999;
    width:20px; height:20px; margin:-10px;
    transition: transform 0.15s ease;
  }

  /* ── CANVAS ── */
  #c {
    position:fixed; inset:0;
    display:block;
  }

  /* ── TOUCH SCREEN OVERLAY ── */
  #touch-screen {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:linear-gradient(160deg, #0a0005 0%, #0f0008 40%, #050003 100%);
    transition: opacity 1.5s ease;
  }
  #touch-screen.hidden { opacity:0; pointer-events:none; }

  .ts-bg-glow {
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(194,24,91,0.1) 0%, transparent 70%);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity:0.6; }
    50% { opacity:1; }
  }

  .ts-deco {
    position:absolute; bottom:0; left:0; width:100%; pointer-events:none;
    opacity:0.25;
  }
  .ts-deco-right {
    position:absolute; top:0; right:0; pointer-events:none;
    opacity:0.18;
    transform:rotate(180deg) scaleX(-1);
  }

  .ts-content {
    position:relative; z-index:2;
    text-align:center;
    animation: floatIn 1.8s ease both;
  }
  @keyframes floatIn {
    from { opacity:0; transform:translateY(30px); }
    to { opacity:1; transform:translateY(0); }
  }

  .ts-icon {
    margin-bottom:24px;
    animation: rotateFloat 6s ease-in-out infinite;
  }
  @keyframes rotateFloat {
    0%,100% { transform:translateY(0) rotate(0deg); }
    33% { transform:translateY(-8px) rotate(3deg); }
    66% { transform:translateY(-4px) rotate(-2deg); }
  }

  .ts-title {
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(28px, 6vw, 56px);
    font-weight:300;
    color:#fff;
    letter-spacing:0.06em;
    line-height:1.15;
    margin-bottom:12px;
  }
  .ts-title em { color:#f8bbd9; font-style:italic; }
  .ts-title .for-name { color:#f48fb1; font-weight:600; }

  .ts-sub {
    font-size:clamp(14px, 2.5vw, 18px);
    font-weight:200;
    color:rgba(255,255,255,0.4);
    letter-spacing:0.18em;
    text-transform:uppercase;
    margin-bottom:52px;
  }

  .tap-hint {
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .tap-circle {
    width:80px; height:80px;
    border-radius:50%;
    border:1px solid rgba(248,187,217,0.4);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    animation: ripplePulse 2.5s ease-in-out infinite;
  }
  .tap-circle::before, .tap-circle::after {
    content:'';
    position:absolute; inset:-8px; border-radius:50%;
    border:1px solid rgba(248,187,217,0.2);
    animation: expandRipple 2.5s ease-in-out infinite;
  }
  .tap-circle::after { inset:-18px; animation-delay:0.4s; border-color:rgba(248,187,217,0.1); }
  @keyframes ripplePulse {
    0%,100% { box-shadow:0 0 0 0 rgba(233,30,140,0.3); }
    50% { box-shadow:0 0 0 12px rgba(233,30,140,0); }
  }
  @keyframes expandRipple {
    0% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.6); }
  }
  .tap-text {
    font-size:12px; letter-spacing:0.3em; text-transform:uppercase;
    color:rgba(255,255,255,0.3); font-weight:200;
  }

  /* ── MESSAGE OVERLAY ── */
  #msg-overlay {
    position:fixed; inset:0; z-index:50;
    pointer-events:none;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    padding:20px;
  }

  .msg-box {
    max-width:680px; width:100%;
    text-align:center;
    opacity:0;
    transition:opacity 2s ease;
  }
  .msg-box.visible { opacity:1; }

  .msg-occasion {
    font-size:clamp(10px, 1.5vw, 12px);
    letter-spacing:0.35em; text-transform:uppercase;
    color:rgba(248,187,217,0.5);
    font-weight:200; margin-bottom:18px;
  }

  .msg-name {
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(36px, 8vw, 80px);
    font-weight:600; font-style:italic;
    line-height:1;
    margin-bottom:20px;
    color:transparent;
    -webkit-text-stroke:1px rgba(248,187,217,0.7);
    text-shadow:
      0 0 40px rgba(233,30,140,0.4),
      0 0 80px rgba(233,30,140,0.2);
    letter-spacing:0.04em;
  }

  .msg-text {
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(16px, 3vw, 26px);
    font-weight:300; font-style:italic;
    color:rgba(255,255,255,0.75);
    line-height:1.8;
    text-shadow:
      0 0 30px rgba(0,0,0,0.8),
      0 2px 8px rgba(0,0,0,0.5);
    letter-spacing:0.02em;
    mix-blend-mode:screen;
  }

  .msg-from {
    margin-top:22px;
    font-size:clamp(11px, 1.8vw, 14px);
    letter-spacing:0.25em; text-transform:uppercase;
    color:rgba(248,187,217,0.4);
    font-weight:200;
  }

  /* ── TYPEWRITER CURSOR ── */
  .tw-cursor {
    display:inline-block; width:2px; height:1em;
    background:rgba(248,187,217,0.7);
    vertical-align:text-bottom; margin-left:3px;
    animation:twBlink 1.1s step-end infinite;
  }
  @keyframes twBlink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── TOP & BOTTOM VIGNETTE ── */
  .vignette-top, .vignette-bot {
    position:fixed; left:0; right:0; z-index:40; pointer-events:none;
  }
  .vignette-top { top:0; height:200px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
  .vignette-bot { bottom:0; height:200px;
    background:linear-gradient(to top, rgba(0,0,0,0.5), transparent); }

  /* ── SHARE BTN (appears at end) ── */
  #share-btn {
    position:fixed; bottom:30px; right:30px; z-index:200;
    padding:12px 24px;
    background:rgba(194,24,91,0.3);
    backdrop-filter:blur(12px);
    border:1px solid rgba(248,187,217,0.3);
    border-radius:100px;
    color:rgba(255,255,255,0.8);
    font-family:'Crimson Pro', serif;
    font-size:15px; font-weight:300;
    cursor:pointer; letter-spacing:0.1em;
    opacity:0; transition:opacity 1s ease, transform 0.2s ease;
    transform:translateY(10px);
  }
  #share-btn.visible { opacity:1; transform:translateY(0); }
  #share-btn:hover { background:rgba(194,24,91,0.5); }
</style>
</head>
<body>

<!-- Custom cursor -->
<svg id="cursor" viewBox="0 0 20 20" fill="none">
  <path d="M10 2C10 2 8 0 5 1C2 2 1.5 5 3 7C4.5 9 7 8.5 7 8.5C7 8.5 5.5 10.5 6 13C6.5 15.5 9 17 11.5 16C14 15 14.5 12.5 13 10.5C11.5 8.5 9 9 9 9C9 9 11.5 7.5 12 5C12.5 2.5 10 2 10 2Z" fill="rgba(248,187,217,0.8)"/>
</svg>

<!-- Touch screen intro -->
<div id="touch-screen">
  <div class="ts-bg-glow"></div>

  <!-- Decorative branch bottom -->
  <svg class="ts-deco" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
    <path d="M0,300 Q200,220 350,180 Q500,140 650,160 Q800,180 950,140 Q1100,100 1200,80" stroke="#c2185b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M350,180 Q360,140 390,115 Q420,90 460,95" stroke="#c2185b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M650,160 Q660,120 685,100 Q710,80 740,85" stroke="#c2185b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M950,140 Q960,100 985,82 Q1010,64 1040,70" stroke="#c2185b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g opacity="0.85">
      <circle cx="462" cy="93" r="7" fill="#f48fb1"/><circle cx="478" cy="87" r="6" fill="#f06292"/><circle cx="448" cy="85" r="5" fill="#fce4ec"/>
      <circle cx="470" cy="100" r="5" fill="#e91e8c"/><circle cx="485" cy="95" r="4" fill="#f8bbd9"/>
    </g>
    <g opacity="0.8">
      <circle cx="742" cy="83" r="7" fill="#f48fb1"/><circle cx="758" cy="77" r="6" fill="#e91e8c"/><circle cx="730" cy="78" r="5" fill="#fce4ec"/>
      <circle cx="752" cy="90" r="5" fill="#f06292"/>
    </g>
    <g opacity="0.75">
      <circle cx="1042" cy="68" r="6" fill="#f48fb1"/><circle cx="1055" cy="62" r="5" fill="#e91e8c"/><circle cx="1033" cy="63" r="4" fill="#fce4ec"/>
    </g>
    <!-- Stars -->
    <circle cx="100" cy="50" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="300" cy="30" r="1" fill="white" opacity="0.5"/>
    <circle cx="500" cy="20" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="700" cy="45" r="1" fill="white" opacity="0.6"/>
    <circle cx="900" cy="25" r="1.5" fill="white" opacity="0.5"/>
    <circle cx="1100" cy="35" r="1" fill="white" opacity="0.4"/>
    <circle cx="150" cy="80" r="1" fill="#f8bbd9" opacity="0.5"/>
    <circle cx="550" cy="60" r="1.5" fill="#f8bbd9" opacity="0.4"/>
    <circle cx="850" cy="70" r="1" fill="#f8bbd9" opacity="0.5"/>
  </svg>

  <div class="ts-content" id="ts-content">
    <div class="ts-icon">
      <svg width="70" height="70" viewBox="0 0 70 70" fill="none">
        <circle cx="35" cy="35" r="34" stroke="rgba(248,187,217,0.2)" stroke-width="1"/>
        <path d="M35 15C35 15 29 10 21 13C13 16 12 24 16 29C20 34 27 32.5 27 32.5C27 32.5 21 38 22.5 46C24 54 31 58 37.5 55.5C44 53 45.5 45.5 42 40.5C38.5 35.5 32 37 32 37C32 37 40 33.5 41.5 25.5C43 17.5 35 15 35 15Z" fill="#e91e8c" opacity="0.9"/>
        <path d="M35 15C35 15 41 10 49 13C57 16 58 24 54 29C50 34 43 32.5 43 32.5C43 32.5 49 38 47.5 46C46 54 39 58 32.5 55.5" fill="#f06292" opacity="0.6"/>
        <circle cx="35" cy="38" r="6" fill="rgba(252,228,236,0.6)"/>
      </svg>
    </div>
    <h1 class="ts-title" id="ts-title">
      A Blossom <em>for you</em>
    </h1>
    <p class="ts-sub" id="ts-sub">Touch anywhere to let it grow</p>
    <div class="tap-hint">
      <div class="tap-circle">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 3L14 25M14 3L8 9M14 3L20 9" stroke="rgba(248,187,217,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="tap-text">touch or click</span>
    </div>
  </div>
</div>

<!-- Vignettes -->
<div class="vignette-top"></div>
<div class="vignette-bot"></div>

<!-- Main canvas -->
<canvas id="c"></canvas>

<!-- Message overlay -->
<div id="msg-overlay">
  <div class="msg-box" id="msg-box">
    <div class="msg-occasion" id="msg-occasion"></div>
    <div class="msg-name" id="msg-name"></div>
    <div class="msg-text" id="msg-text"></div>
    <div class="msg-from" id="msg-from"></div>
  </div>
</div>

<!-- Share button -->
<button id="share-btn" onclick="shareThis()">Share this blossom ✦</button>

<script>
// ── PARSE URL DATA ──
let wishData = { recipient:'', sender:'', message:'Happy birthday! 🌸', occasion:'birthday', theme:'sakura' };
try {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('d');
  if (raw) wishData = JSON.parse(decodeURIComponent(escape(atob(raw))));
} catch(e) {}

// ── THEME PALETTES ──
const themes = {
  sakura: {
    sky: ['#0d0210','#1a0520','#2d0a35'],
    trunk: ['#5d1a2b','#8b2a3a','#c4587a'],
    leaves: ['#ff4d8a','#ff8fb1','#ffb7c5','#f06292','#e91e8c','#ffd9e8','#ff69b4','#c2185b'],
    glow: 'rgba(233,30,140,',
    fog: 'rgba(194,24,91,',
    stars: '#fce4ec',
    ground: '#2d0a20'
  },
  midnight: {
    sky: ['#03001a','#07003a','#0a0050'],
    trunk: ['#1a1050','#2d1a80','#5040a0'],
    leaves: ['#9c27b0','#e040fb','#ce93d8','#7c4dff','#b39ddb','#ea80fc','#ab47bc','#651fff'],
    glow: 'rgba(156,39,176,',
    fog: 'rgba(103,58,183,',
    stars: '#e1bee7',
    ground: '#0a0030'
  },
  gold: {
    sky: ['#0d0800','#1a1200','#2a1800'],
    trunk: ['#4a2800','#7a4500','#b06820'],
    leaves: ['#ff9800','#ffc107','#ffeb3b','#ff7043','#ff5722','#ffe082','#ffcc02','#f57c00'],
    glow: 'rgba(255,152,0,',
    fog: 'rgba(255,87,34,',
    stars: '#fff9c4',
    ground: '#1a0d00'
  },
  ocean: {
    sky: ['#001a14','#003028','#004d3a'],
    trunk: ['#00251a','#00574a','#008070'],
    leaves: ['#00bcd4','#26c6da','#80deea','#00897b','#26a69a','#b2dfdb','#00acc1','#4db6ac'],
    glow: 'rgba(0,188,212,',
    fog: 'rgba(0,137,123,',
    stars: '#e0f7fa',
    ground: '#001a10'
  }
};
const T = themes[wishData.theme] || themes.sakura;

// ── CANVAS SETUP ──
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); if (started) redrawStatic(); });

// ── CUSTOM CURSOR ──
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top = e.clientY + 'px';
});

// ── STATE ──
let started = false;
let phase = 'idle'; // idle | seed-fall | grow | bloom | message | done
let clock = 0;
let seedX, seedY, seedTargetY;
let trunkH = 0, maxTrunkH;
let branches = [];
let hearts = [];
let fallingPetals = [];
let groundFog = [];
let stars = [];
let fireflies = [];
let clickX, clickY;
let msgShown = false;
let phaseStart = 0;

// ── GENERATE STARS ──
function genStars() {
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H * 0.7,
      r: Math.random() * 1.2 + 0.3,
      alpha: Math.random() * 0.7 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    });
  }
}
genStars();

// ── GENERATE FIREFLIES ──
function genFireflies() {
  fireflies = [];
  for (let i = 0; i < 18; i++) {
    fireflies.push({
      x: Math.random() * W, y: H * 0.3 + Math.random() * H * 0.5,
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.3,
      alpha: 0, maxAlpha: Math.random()*0.7+0.2,
      phase: Math.random()*Math.PI*2, speed: Math.random()*0.03+0.01,
      r: Math.random()*2+1,
      color: T.leaves[Math.floor(Math.random()*T.leaves.length)]
    });
  }
}
genFireflies();

// ── DRAW SKY ──
function drawSky(progress) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, T.sky[0]);
  grad.addColorStop(0.5, T.sky[1]);
  grad.addColorStop(1, T.sky[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Nebula / aurora glow
  const nx = W * 0.5, ny = H * 0.25;
  const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, W * 0.5);
  ng.addColorStop(0, T.glow + '0.06)');
  ng.addColorStop(0.5, T.glow + '0.03)');
  ng.addColorStop(1, 'transparent');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);
}

// ── DRAW STARS ──
function drawStars(alpha) {
  stars.forEach(s => {
    s.twinkle += s.speed;
    const a = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle)) * alpha;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = T.stars.replace(')', `,${a})`).replace('#','rgba(').replace(/([0-9a-f]{2})/gi, (m,p) => parseInt(p,16)+',').slice(0,-1) + `)`;
    // simpler:
    ctx.fillStyle = `rgba(255,235,245,${a})`;
    ctx.fill();
  });
}

// ── DRAW GROUND ──
function drawGround() {
  const gy = H * 0.82;
  // Ground plane
  const gg = ctx.createLinearGradient(0, gy, 0, H);
  gg.addColorStop(0, T.ground);
  gg.addColorStop(1, T.sky[2]);
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.ellipse(W/2, H, W*0.9, H*0.25, 0, 0, Math.PI);
  ctx.fill();

  // Ground glow under tree
  const treeX = W/2;
  const gg2 = ctx.createRadialGradient(treeX, gy, 0, treeX, gy, W*0.35);
  gg2.addColorStop(0, T.glow+'0.15)');
  gg2.addColorStop(1, 'transparent');
  ctx.fillStyle = gg2;
  ctx.fillRect(treeX - W*0.4, gy-40, W*0.8, 80);
}

// ── DRAW GROUND FOG ──
function drawFog() {
  const gy = H * 0.82;
  groundFog.forEach(f => {
    f.x += f.vx; f.alpha += f.da;
    if (f.alpha > f.maxAlpha) f.da = -f.da * 0.5;
    if (f.alpha < 0) {
      f.x = W/2 + (Math.random()-0.5)*W*0.5;
      f.alpha = 0; f.da = Math.random()*0.001+0.0003;
    }
    const fg = ctx.createRadialGradient(f.x, gy, 0, f.x, gy, f.r);
    fg.addColorStop(0, T.fog+f.alpha+')');
    fg.addColorStop(1, 'transparent');
    ctx.fillStyle = fg;
    ctx.fillRect(f.x-f.r, gy-f.r*0.3, f.r*2, f.r*0.6);
  });
}

// ── GENERATE FOG ──
function genFog() {
  for (let i = 0; i < 12; i++) {
    groundFog.push({
      x: W/2 + (Math.random()-0.5)*W*0.6,
      vx: (Math.random()-0.5)*0.15,
      alpha: 0, maxAlpha: Math.random()*0.06+0.02,
      da: Math.random()*0.001+0.0002,
      r: Math.random()*120+80
    });
  }
}
genFog();

// ── DRAW SEED ──
function drawSeed(x, y, progress) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(progress * Math.PI * 8);
  // Seed shape
  const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 8);
  sg.addColorStop(0, '#fce4ec');
  sg.addColorStop(0.5, '#f48fb1');
  sg.addColorStop(1, 'rgba(194,24,91,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.ellipse(0, 0, 5, 10, 0, 0, Math.PI*2);
  ctx.fill();
  // Glow
  ctx.shadowColor = T.leaves[0];
  ctx.shadowBlur = 20;
  ctx.fillStyle = 'rgba(255,200,220,0.9)';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ── DRAW SEED TRAIL ──
let seedTrail = [];
function updateSeedTrail(x, y) {
  seedTrail.push({ x, y, alpha: 0.8, r: Math.random()*3+1 });
  if (seedTrail.length > 30) seedTrail.shift();
}
function drawSeedTrail() {
  seedTrail.forEach((p, i) => {
    p.alpha -= 0.025;
    if (p.alpha < 0) p.alpha = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (i/seedTrail.length), 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,182,193,${p.alpha})`;
    ctx.fill();
  });
}

// ── DRAW TRUNK ──
function drawTrunk(progress) {
  if (progress <= 0) return;
  const treeX = W/2;
  const treeBaseY = H * 0.82;
  maxTrunkH = H * 0.38;
  const h = maxTrunkH * Math.min(progress, 1);
  const topY = treeBaseY - h;
  const w0 = 28 * Math.min(progress * 3, 1);

  ctx.save();
  // Trunk glow
  ctx.shadowColor = T.glow + '0.4)';
  ctx.shadowBlur = 25;

  // Main trunk
  const tg = ctx.createLinearGradient(treeX-w0, topY, treeX+w0*2, treeBaseY);
  tg.addColorStop(0, T.trunk[2]);
  tg.addColorStop(0.4, T.trunk[1]);
  tg.addColorStop(1, T.trunk[0]);

  ctx.beginPath();
  ctx.moveTo(treeX - w0, treeBaseY);
  ctx.bezierCurveTo(
    treeX - w0*1.5, treeBaseY - h*0.3,
    treeX - w0*0.5, treeBaseY - h*0.75,
    treeX - w0*0.3, topY
  );
  ctx.lineTo(treeX + w0*0.3, topY);
  ctx.bezierCurveTo(
    treeX + w0*0.5, treeBaseY - h*0.75,
    treeX + w0*1.5, treeBaseY - h*0.3,
    treeX + w0, treeBaseY
  );
  ctx.closePath();
  ctx.fillStyle = tg;
  ctx.fill();

  // Bark texture lines
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 0.8;
  for (let i = 0; i < 5; i++) {
    const t = 0.2 + i * 0.15;
    ctx.beginPath();
    ctx.moveTo(treeX - w0*(1-t*0.3), treeBaseY - h*t*0.95);
    ctx.bezierCurveTo(
      treeX - w0*0.3, treeBaseY - h*(t+0.05),
      treeX + w0*0.1, treeBaseY - h*(t+0.04),
      treeX + w0*(1-t*0.3)*0.6, treeBaseY - h*t*0.97
    );
    ctx.stroke();
  }

  ctx.restore();
}

// ── GENERATE BRANCHES ──
function generateBranches() {
  branches = [];
  const treeX = W/2, treeBaseY = H * 0.82;
  const topY = treeBaseY - maxTrunkH;
  const branchData = [
    // [relY from top, angle, length, thickness, subBranches]
    [0.05, -0.7, 0.14, 6, 3],
    [0.1,   0.65, 0.13, 5.5, 3],
    [0.18, -0.5, 0.12, 5, 2],
    [0.22,  0.55, 0.12, 4.5, 2],
    [0.32, -0.4, 0.10, 4, 2],
    [0.35,  0.45, 0.10, 3.5, 2],
    [0.45, -0.35, 0.09, 3, 1],
    [0.5,   0.4,  0.09, 3, 1],
    [0.6,  -0.3,  0.08, 2.5, 1],
    [0.62,  0.35, 0.08, 2, 1],
    [0.72, -0.55, 0.07, 2, 0],
    [0.75,  0.5,  0.07, 2, 0],
  ];

  branchData.forEach(([ry, angle, lenRatio, thick, subs]) => {
    const startX = treeX + (angle > 0 ? 8 : -8);
    const startY = topY + maxTrunkH * ry;
    const len = maxTrunkH * lenRatio;
    const endX = startX + Math.cos(angle * Math.PI) * len;
    const endY = startY - Math.abs(Math.sin(angle * Math.PI * 0.8)) * len * 0.9;

    const subList = [];
    for (let s = 0; s < subs; s++) {
      const sa = angle * (0.6 + s * 0.3) + (Math.random()-0.5)*0.2;
      const sl = len * (0.5 + Math.random()*0.2);
      subList.push({
        sx: endX, sy: endY,
        ex: endX + Math.cos(sa * Math.PI) * sl,
        ey: endY - Math.abs(Math.sin(sa * Math.PI * 0.6)) * sl * 0.8,
        thick: thick * 0.55, progress: 0
      });
    }

    branches.push({
      sx: startX, sy: startY, ex: endX, ey: endY,
      thick, progress: 0, ry, subs: subList,
      ctrl1x: startX + (endX-startX)*0.3 + (Math.random()-0.5)*20,
      ctrl1y: startY - (startY-endY)*0.2,
      ctrl2x: startX + (endX-startX)*0.7 + (Math.random()-0.5)*15,
      ctrl2y: endY + (startY-endY)*0.1
    });
  });
}

// ── DRAW BRANCHES ──
function drawBranches(globalP) {
  branches.forEach(b => {
    const targetP = Math.max(0, Math.min(1, (globalP - b.ry * 0.5) / 0.5));
    if (targetP <= 0) return;
    b.progress = targetP;

    ctx.save();
    ctx.shadowColor = T.glow+'0.3)'; ctx.shadowBlur = 8;

    // Sub-bezier drawing (partial)
    const cx = b.sx + (b.ex - b.sx) * targetP;
    const cy = b.sy + (b.ey - b.sy) * targetP;

    ctx.beginPath();
    ctx.moveTo(b.sx, b.sy);
    if (targetP < 1) {
      // Lerp along the bezier
      const t = targetP;
      const qx = lerp(lerp(b.sx, b.ctrl1x, t), lerp(b.ctrl1x, b.ctrl2x, t), t);
      const qy = lerp(lerp(b.sy, b.ctrl1y, t), lerp(b.ctrl1y, b.ctrl2y, t), t);
      const rx = lerp(lerp(b.ctrl1x, b.ctrl2x, t), lerp(b.ctrl2x, b.ex, t), t);
      const ry = lerp(lerp(b.ctrl1y, b.ctrl2y, t), lerp(b.ctrl2y, b.ey, t), t);
      const ex = lerp(qx, rx, t), ey = lerp(qy, ry, t);
      ctx.bezierCurveTo(b.ctrl1x, b.ctrl1y, qx, qy, ex, ey);
    } else {
      ctx.bezierCurveTo(b.ctrl1x, b.ctrl1y, b.ctrl2x, b.ctrl2y, b.ex, b.ey);
    }

    const tg = ctx.createLinearGradient(b.sx, b.sy, b.ex, b.ey);
    tg.addColorStop(0, T.trunk[1]); tg.addColorStop(1, T.trunk[2]);
    ctx.strokeStyle = tg;
    ctx.lineWidth = b.thick * (1 - targetP * 0.3);
    ctx.lineCap = 'round';
    ctx.stroke();

    // Sub-branches
    if (targetP > 0.7) {
      const sp = (targetP - 0.7) / 0.3;
      b.subs.forEach(sub => {
        ctx.beginPath();
        ctx.moveTo(sub.sx, sub.sy);
        const ex2 = sub.sx + (sub.ex - sub.sx) * sp;
        const ey2 = sub.sy + (sub.ey - sub.sy) * sp;
        ctx.lineTo(ex2, ey2);
        ctx.strokeStyle = T.trunk[2]; ctx.lineWidth = sub.thick;
        ctx.stroke();
      });
    }
    ctx.restore();
  });
}

function lerp(a, b, t) { return a + (b-a)*t; }

// ── GENERATE HEART CANOPY ──
function generateHearts() {
  hearts = [];
  const treeX = W/2, treeBaseY = H*0.82;
  const topY = treeBaseY - maxTrunkH;

  // Main canopy - heart shaped cloud
  const canopyCX = treeX, canopyCY = topY - maxTrunkH * 0.18;
  const scale = Math.min(W, H) * 0.28;

  for (let i = 0; i < 1200; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.85 + 0.05;
    // Heart parametric: x = 16sin^3(t), y = 13cos-5cos2t-2cos3t-cos4t
    const hx = r * 16 * Math.pow(Math.sin(t), 3);
    const hy = r * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));

    // Depth simulation
    const depth = Math.random();
    const px = canopyCX + hx * scale / 16;
    const py = canopyCY - hy * scale / 16;

    // Add to branches too
    const leafColor = T.leaves[Math.floor(Math.random() * T.leaves.length)];
    const size = Math.random() * 7 + 3;

    hearts.push({
      x: px, y: py,
      size,
      color: leafColor,
      alpha: Math.random() * 0.4 + 0.6,
      depth,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: Math.random() * 0.02 + 0.005,
      swayAmp: Math.random() * 2 + 0.5,
      progress: Math.random(), // for staggered bloom
      visible: false
    });
  }

  // Sort by depth for pseudo-3D
  hearts.sort((a,b) => a.depth - b.depth);

  // Also scatter hearts on branches
  branches.forEach(b => {
    for (let i = 0; i < 60; i++) {
      const t = Math.random();
      const bx = lerp(lerp(b.sx, b.ctrl1x, t), lerp(b.ctrl2x, b.ex, t), t);
      const by = lerp(lerp(b.sy, b.ctrl1y, t), lerp(b.ctrl2y, b.ey, t), t);
      hearts.push({
        x: bx + (Math.random()-0.5)*30,
        y: by + (Math.random()-0.5)*20,
        size: Math.random()*5+2,
        color: T.leaves[Math.floor(Math.random()*T.leaves.length)],
        alpha: Math.random()*0.5+0.4,
        depth: 0.5,
        sway: Math.random()*Math.PI*2,
        swaySpeed: Math.random()*0.02+0.005,
        swayAmp: Math.random()*1.5+0.5,
        progress: Math.random(),
        visible: false
      });
    }
  });
}

// ── DRAW SINGLE HEART ──
function drawHeart(x, y, size, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color; ctx.shadowBlur = size * 2;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - size, y - size, x - size*2, y + size*0.4, x, y + size*2);
  ctx.bezierCurveTo(x + size*2, y + size*0.4, x + size, y - size, x, y);
  ctx.fill();
  ctx.restore();
}

// ── DRAW CANOPY ──
let bloomCount = 0;
function drawCanopy(bloomProgress) {
  const target = Math.floor(hearts.length * bloomProgress);
  bloomCount = target;

  hearts.slice(0, target).forEach(h => {
    h.sway += h.swaySpeed;
    const sx = h.x + Math.sin(h.sway) * h.swayAmp;
    const sy = h.y + Math.cos(h.sway * 0.7) * h.swayAmp * 0.5;

    // Depth-based scale
    const sc = 0.5 + h.depth * 0.8;
    const a = h.alpha * (0.4 + h.depth * 0.6);

    drawHeart(sx, sy, h.size * sc, h.color, a);
  });

  // Canopy ambient glow
  if (bloomProgress > 0.3) {
    const treeX = W/2, treeBaseY = H*0.82;
    const topY = treeBaseY - maxTrunkH - maxTrunkH*0.18;
    const r = Math.min(W,H) * 0.32 * bloomProgress;
    const cg = ctx.createRadialGradient(treeX, topY, 0, treeX, topY, r);
    cg.addColorStop(0, T.glow+(0.08*bloomProgress)+')');
    cg.addColorStop(0.5, T.glow+(0.03*bloomProgress)+')');
    cg.addColorStop(1, 'transparent');
    ctx.fillStyle = cg;
    ctx.fillRect(treeX-r, topY-r, r*2, r*2);
  }
}

// ── FALLING PETALS ──
function spawnPetal() {
  const treeX = W/2, treeBaseY = H*0.82;
  const topY = treeBaseY - maxTrunkH;
  const spread = Math.min(W, H) * 0.32;
  fallingPetals.push({
    x: treeX + (Math.random()-0.5)*spread*1.5,
    y: topY - (Math.random()*spread*0.5),
    vx: (Math.random()-0.5)*1.2,
    vy: Math.random()*0.8+0.3,
    rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.06,
    size: Math.random()*5+2,
    color: T.leaves[Math.floor(Math.random()*T.leaves.length)],
    alpha: Math.random()*0.6+0.3,
    wobble: Math.random()*Math.PI*2,
    wobbleSpeed: Math.random()*0.04+0.02
  });
}

function drawFallingPetals() {
  const gy = H * 0.85;
  fallingPetals = fallingPetals.filter(p => p.y < gy && p.alpha > 0.02);
  fallingPetals.forEach(p => {
    p.wobble += p.wobbleSpeed;
    p.x += p.vx + Math.sin(p.wobble) * 0.5;
    p.y += p.vy;
    p.rot += p.vrot;
    p.vx *= 0.998;

    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    ctx.shadowColor = p.color; ctx.shadowBlur = p.size;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    const s = p.size;
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-s, -s, -s*2, s*0.4, 0, s*2);
    ctx.bezierCurveTo(s*2, s*0.4, s, -s, 0, 0);
    ctx.fill();
    ctx.restore();
  });
}

// ── FIREFLIES ──
function drawFireflies(alpha) {
  fireflies.forEach(f => {
    f.phase += f.speed;
    f.x += f.vx + Math.sin(f.phase*0.7)*0.3;
    f.y += f.vy + Math.cos(f.phase*0.5)*0.2;
    f.alpha = Math.abs(Math.sin(f.phase)) * f.maxAlpha * alpha;
    if (f.x < 0) f.x = W; if (f.x > W) f.x = 0;
    if (f.y < H*0.2 || f.y > H*0.9) f.vy *= -1;

    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.globalAlpha = f.alpha;
    ctx.shadowColor = f.color; ctx.shadowBlur = f.r*4;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });
}

// ── TYPEWRITER ──
function typewrite(el, text, speed, cb) {
  let i = 0;
  el.innerHTML = '';
  const interval = setInterval(() => {
    el.innerHTML = text.substring(0,i+1) + '<span class="tw-cursor"></span>';
    i++;
    if (i >= text.length) { clearInterval(interval); el.innerHTML = text; if(cb) cb(); }
  }, speed);
}

// ── SHOW MESSAGE ──
function showMessage() {
  if (msgShown) return;
  msgShown = true;

  const box = document.getElementById('msg-box');
  const occasionNames = { birthday:'Birthday', anniversary:'Anniversary', graduation:'Graduation', new_year:'New Year', love:'With Love', friendship:'Friendship', farewell:'Farewell', custom:'A Special Moment' };

  document.getElementById('msg-occasion').textContent = '— ' + (occasionNames[wishData.occasion]||'A Special Moment') + ' —';

  setTimeout(() => {
    box.classList.add('visible');
    const nameEl = document.getElementById('msg-name');
    const textEl = document.getElementById('msg-text');
    const fromEl = document.getElementById('msg-from');

    if (wishData.recipient) {
      typewrite(nameEl, 'For ' + wishData.recipient, 80, () => {
        setTimeout(() => {
          typewrite(textEl, wishData.message, 45, () => {
            if (wishData.sender) {
              setTimeout(() => {
                fromEl.style.opacity = '0';
                fromEl.textContent = '— ' + wishData.sender;
                fromEl.style.transition = 'opacity 1.5s';
                setTimeout(() => fromEl.style.opacity = '1', 50);
              }, 600);
            }
            // Show share button
            setTimeout(() => document.getElementById('share-btn').classList.add('visible'), 1500);
          });
        }, 400);
      });
    } else {
      typewrite(textEl, wishData.message, 45, () => {
        setTimeout(() => document.getElementById('share-btn').classList.add('visible'), 1500);
      });
    }
  }, 1200);
}

// ── MAIN ANIMATION ──
let seedFallProgress = 0;
let growProgress = 0;
let bloomProgress = 0;
let phaseTimer = 0;
let petalTimer = 0;

function animate() {
  clock++;
  ctx.clearRect(0, 0, W, H);

  // Sky
  const skyAlpha = phase === 'idle' ? 0 : 1;
  drawSky(1);
  drawStars(phase === 'idle' ? 0 : Math.min(clock * 0.02, 1));
  drawGround();
  drawFog();
  drawFireflies(phase === 'idle' ? 0 : Math.min((clock - 20)*0.02, 1));

  if (phase === 'seed-fall') {
    seedFallProgress += 0.018;
    const sy = lerp(seedY, seedTargetY, easeOut(seedFallProgress));
    const sx = lerp(seedX, W/2, easeOut(seedFallProgress));
    updateSeedTrail(sx, sy);
    drawSeedTrail();
    drawSeed(sx, sy, seedFallProgress);

    if (seedFallProgress >= 1) {
      phase = 'grow';
      phaseTimer = 0;
      generateBranches();
    }
  }

  if (phase === 'grow' || phase === 'bloom' || phase === 'message' || phase === 'done') {
    phaseTimer++;

    if (phase === 'grow') {
      growProgress += 0.012;
      drawTrunk(Math.min(growProgress, 1));
      drawBranches(Math.min(growProgress * 0.7, 1));

      if (growProgress >= 1) {
        phase = 'bloom';
        phaseTimer = 0;
        generateHearts();
      }
    } else {
      drawTrunk(1);
      drawBranches(1);
    }

    if (phase === 'bloom' || phase === 'message' || phase === 'done') {
      bloomProgress = Math.min(bloomProgress + 0.006, 1);
      drawCanopy(bloomProgress);

      // Spawn falling petals
      if (bloomProgress > 0.3) {
        petalTimer++;
        if (petalTimer % 4 === 0 && fallingPetals.length < 150) spawnPetal();
      }
      drawFallingPetals();

      if (bloomProgress >= 0.85 && !msgShown) showMessage();
    }
  }

  // Idle state: just stars and bg
  if (phase === 'idle') {
    drawFallingPetals();
  }

  requestAnimationFrame(animate);
}

function easeOut(t) {
  return 1 - Math.pow(1 - Math.min(t,1), 3);
}

// ── START ──
function startBloom(event) {
  if (started) return;
  started = true;

  const ts = document.getElementById('touch-screen');
  ts.classList.add('hidden');

  // Get click position for seed origin
  const x = event.clientX || event.touches?.[0]?.clientX || W/2;
  const y = event.clientY || event.touches?.[0]?.clientY || H/2;

  seedX = x; seedY = y;
  seedTargetY = H * 0.82;
  phase = 'seed-fall';

  // Personalise the touch screen name
  if (wishData.recipient) {
    document.getElementById('ts-title').innerHTML = `For <span class="for-name">${wishData.recipient}</span>`;
  }

  animate();
}

// ── SETUP TOUCH SCREEN TEXT ──
window.addEventListener('DOMContentLoaded', () => {
  if (wishData.recipient) {
    document.getElementById('ts-title').innerHTML =
      `A Blossom <em>for ${wishData.recipient}</em>`;
    document.title = `A Blossom for ${wishData.recipient}`;
  }

  const touchScreen = document.getElementById('touch-screen');
  touchScreen.addEventListener('click', startBloom);
  touchScreen.addEventListener('touchstart', startBloom, { passive: true });

  // Start idle animation for background
  animate();
});

// ── SHARE ──
function shareThis() {
  if (navigator.share) {
    navigator.share({ title: `A Blossom for ${wishData.recipient||'you'}`, url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const btn = document.getElementById('share-btn');
      btn.textContent = 'Link copied ✓';
      setTimeout(() => btn.textContent = 'Share this blossom ✦', 2000);
    });
  }
}

// ── CURSOR FOLLOW ──
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top = e.clientY + 'px';
});
