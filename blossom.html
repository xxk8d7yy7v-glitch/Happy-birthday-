<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Blossom Wish For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-soft: #f8bbd9;
    --gold: #d4a853;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Crimson Pro', serif;
    background-color: #0d0508;
    color: #fff;
  }

  /* ── BACKGROUND VIDEO CONTAINER ── */
  /* This container will smoothly shift to the left side when the 'shift-left' class is added */
  .video-container {
    position: fixed; 
    inset: 0;
    width: 100%; 
    height: 100%;
    z-index: 0;
    overflow: hidden;
    transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1);
    transform: translateX(0);
  }

  /* When shifted, moves the video window left on wide screens */
  .video-container.shift-left {
    transform: translateX(-25%);
  }

  video {
    width: 100%; 
    height: 100%;
    object-fit: cover;
  }

  /* Subtle vignette over the video to help text visibility */
  .video-overlay {
    position: absolute; 
    inset: 0;
    background: radial-gradient(circle at center, transparent 20%, rgba(13, 5, 8, 0.4) 80%);
    z-index: 1;
  }

  /* ── TEXT OVERLAY LAYOUT (NO CONTAINER) ── */
  .content-container {
    position: relative; 
    z-index: 10;
    width: 100%; 
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr; /* Pushes text to the right side of the screen */
    padding: 60px;
    pointer-events: none; /* Allows interactions to pass through to the video if needed */
  }

  .text-column {
    grid-column: 2; /* Forces the text to occupy only the right half */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding-left: 40px;
  }

  /* Typography styling without borders, background boxes, or cards */
  .recipient-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 4.5vw, 46px);
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-bottom: 28px;
    color: #fff;
    line-height: 1.2;
    min-height: 55px; /* Prevents layout shifting during typing */
  }

  .recipient-title em {
    font-style: italic;
    color: var(--pink-soft);
    font-weight: 400;
  }

  .message-body {
    font-size: clamp(18px, 2.2vw, 24px);
    font-weight: 300;
    line-height: 1.8;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 40px;
    white-space: pre-wrap;
    max-width: 500px;
    min-height: 150px;
  }

  .sender-signoff {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    letter-spacing: 0.15em;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .sender-signoff.show {
    opacity: 1;
  }

  .sender-signoff span {
    display: block;
    margin-top: 6px;
    font-family: 'Crimson Pro', serif;
    font-size: 26px;
    font-style: normal;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  /* Blinking typing cursor effect */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 0.8em;
    background-color: var(--pink-soft);
    margin-left: 3px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ── THEME PALETTES ── */
  body.theme-sakura { --pink-soft: #f8bbd9; --gold: #e91e8c; }
  body.theme-midnight { --pink-soft: #b388ff; --gold: #00e5ff; }
  body.theme-gold { --pink-soft: #ffe082; --gold: #ffb300; }
  body.theme-ocean { --pink-soft: #80deea; --gold: #26a69a; }

  /* Mobile Responsive adjustments */
  @media (max-width: 900px) {
    .content-container {
      grid-template-columns: 1fr;
      padding: 30px;
    }
    .text-column {
      grid-column: 1;
      padding-left: 0;
      justify-content: flex-end;
      padding-bottom: 40px;
    }
    .video-container.shift-left {
      transform: translateY(-15%); /* Shifts video upward instead on mobile viewports */
    }
  }

  .audio-hint {
    position: absolute; bottom: 20px; left: 20px;
    z-index: 15; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px; border-radius: 30px;
    font-size: 12px; font-weight: 200; cursor: pointer;
    letter-spacing: 0.05em; transition: 0.3s; pointer-events: auto;
  }
</style>
</head>
<body class="theme-sakura">

<div class="video-container" id="video-window">
  <video id="bg-video" autoplay muted playsinline>
    <source src="Tree.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="video-overlay"></div>
</div>

<div class="audio-hint" id="audio-toggle" onclick="toggleMute()">Mute Controls</div>

<div class="content-container">
  <div class="text-column">
    <h1 class="recipient-title" id="view-recipient"></h1>
    <p class="message-body" id="view-message"></p>
    <p class="sender-signoff" id="sender-container">With Love, <span id="view-sender"></span></p>
  </div>
</div>

<script>
let wishData = { recipient: "Someone", message: "A beautiful wish...", sender: "", theme: "sakura" };

// ── PARSE URL DATA ──
function loadData() {
  const urlParams = new URLSearchParams(window.location.search);
  const dataParam = urlParams.get('d');
  if (dataParam) {
    try {
      wishData = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
      if (wishData.theme) {
        document.body.className = '';
        document.body.classList.add(`theme-${wishData.theme}`);
      }
    } catch (e) {
      console.error("Decoding error", e);
    }
  }
}
loadData();

// ── TIMING LOGIC ──
const video = document.getElementById('bg-video');
const videoWindow = document.getElementById('video-window');

// Automatically fires when your video runs to completion
video.addEventListener('ended', () => {
  // 1. Shift video window to the left side
  videoWindow.classList.add('shift-left');
  
  // 2. Wait for the shifting animation to finish (1.8 seconds), then begin typing words
  setTimeout(() => {
    startTypingSequence();
  }, 1800);
});

// Fallback safety check: In case video fails to fire 'ended' event, start after 8s
setTimeout(() => {
  if (!videoWindow.classList.contains('shift-left')) {
    videoWindow.classList.add('shift-left');
    startTypingSequence();
  }
}, 8000);


// ── TYPEWRITER ENGINE ──
function typeText(element, text, speed, callback) {
  let index = 0;
  element.innerHTML = ""; // Clear existing target
  
  // Create dynamic cursor element
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  element.appendChild(cursor);

  function type() {
    if (index < text.length) {
      // Insert character right before the cursor node
      cursor.insertAdjacentText('beforebegin', text.charAt(index));
      index++;
      setTimeout(type, speed);
    } else {
      cursor.remove(); // Drop cursor when this section is written
      if (callback) callback();
    }
  }
  type();
}

function startTypingSequence() {
  const recipientTarget = document.getElementById('view-recipient');
  const messageTarget = document.getElementById('view-message');
  const senderTarget = document.getElementById('view-sender');
  const signoffBlock = document.getElementById('sender-container');

  const greetingText = `To My Dearest ${wishData.recipient || 'Someone'},`;
  const bodyText = wishData.message || '';
  const signoffName = wishData.sender || '';

  // Type Greeting first...
  typeText(recipientTarget, greetingText, 70, () => {
    // ...then type the primary message...
    typeText(messageTarget, bodyText, 45, () => {
      // ...finally, fade in the signature line smoothly
      if (signoffName) {
        senderTarget.textContent = signoffName;
        signoffBlock.classList.add('show');
      }
    });
  });
}

// ── AUDIO HANDLER ──
function toggleMute() {
  if (video.muted) {
    video.muted = false;
    document.getElementById('audio-toggle').textContent = "🔊 Audio On";
  } else {
    video.muted = true;
    document.getElementById('audio-toggle').textContent = "🔇 Muted";
  }
}
</script>
</body>
</html>
