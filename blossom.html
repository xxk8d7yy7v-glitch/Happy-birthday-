<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Blossom Wish For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --theme-overlay: rgba(26, 10, 16, 0.4); /* Dynamic overlay to maintain text legibility */
    --pink-soft: #f8bbd9;
    --gold: #d4a853;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Crimson Pro', serif;
    background-color: #0d0508;
    color: #fff;
  }

  /* ── BACKGROUND VIDEO ── */
  .video-container {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
  }

  video {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* Dark overlay grid to ensure text pops cleanly over any video background */
  .video-overlay {
    position: absolute; inset: 0;
    background: var(--theme-overlay);
    z-index: 1;
    transition: background 0.5s ease;
  }

  /* ── INTERACTIVE OVERLAY CARD ── */
  .content-container {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .wish-card {
    width: 100%; max-width: 550px;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    animation: revealCard 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.5s;
  }

  @keyframes revealCard {
    to { opacity: 1; transform: translateY(0); }
  }

  .recipient-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-bottom: 24px;
    color: #fff;
    line-height: 1.2;
  }

  .recipient-title em {
    font-style: italic;
    color: var(--pink-soft);
    font-weight: 400;
  }

  .message-body {
    font-size: clamp(16px, 2.5vw, 20px);
    font-weight: 300;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 32px;
    white-space: pre-wrap; /* Keeps line breaks from textareas */
  }

  .sender-signoff {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-style: italic;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
  }

  .sender-signoff span {
    display: block;
    margin-top: 4px;
    font-family: 'Crimson Pro', serif;
    font-size: 22px;
    font-style: normal;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  /* ── THEME VARIATIONS (Dynamically Injected) ── */
  body.theme-sakura { --theme-overlay: rgba(26, 10, 16, 0.35); --pink-soft: #f8bbd9; --gold: #e91e8c; }
  body.theme-midnight { --theme-overlay: rgba(10, 13, 38, 0.5); --pink-soft: #b388ff; --gold: #00e5ff; }
  body.theme-gold { --theme-overlay: rgba(38, 24, 0, 0.4); --pink-soft: #ffe082; --gold: #ffb300; }
  body.theme-ocean { --theme-overlay: rgba(0, 24, 31, 0.45); --pink-soft: #80deea; --gold: #26a69a; }

  /* Mute button layout in case browser auto-play blocks audio */
  .audio-hint {
    position: absolute; bottom: 20px; right: 20px;
    z-index: 15; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px; border-radius: 30px;
    font-size: 12px; font-weight: 200; cursor: pointer;
    letter-spacing: 0.05em; transition: 0.3s;
  }
  .audio-hint:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body class="theme-sakura">

<div class="video-container">
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="Tree.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="video-overlay"></div>
</div>

<div class="audio-hint" id="audio-toggle" onclick="toggleMute()">🔇 Tap to Unmute</div>

<div class="content-container">
  <div class="wish-card">
    <h1 class="recipient-title">To My Dearest <em id="view-recipient">Someone</em>,</h1>
    
    <p class="message-body" id="view-message">Loading your special blossom message...</p>
    
    <p class="sender-signoff" id="sender-container">With Love, <span id="view-sender">An Admirer</span></p>
  </div>
</div>

<script>
// ── PARSE DATA FROM URL PARAMETERS ──
function getWishData() {
  const urlParams = new URLSearchParams(window.location.search);
  const dataParam = urlParams.get('d');

  if (!dataParam) {
    document.getElementById('view-message').textContent = "No wish parameters found. Scan your code or click a valid link!";
    return;
  }

  try {
    // Decode the Base64 custom format handled by your index.html
    const decodedData = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
    renderWish(decodedData);
  } catch (error) {
    console.error("Failed to decode template details:", error);
    document.getElementById('view-message').textContent = "Oops! Something went wrong loading this beautiful moment.";
  }
}

// ── RENDER DATA ON THE OVERLAY ──
function renderWish(data) {
  // Set text fields safely
  if(data.recipient) document.getElementById('view-recipient').textContent = data.recipient;
  if(data.message) document.getElementById('view-message').textContent = data.message;
  
  if(data.sender) {
    document.getElementById('view-sender').textContent = data.sender;
  } else {
    // Hide the sender area entirely if the field was left empty
    document.getElementById('sender-container').style.display = 'none';
  }

  // Inject Theme into the body class to match user selection
  if (data.theme) {
    document.body.className = ''; // wipe defaults
    document.body.classList.add(`theme-${data.theme}`);
  }
}

// ── AUDIO BYPASS ──
// Browsers block autoplay videos with sound enabled. This enables soft unmuting on click.
const video = document.getElementById('bg-video');
const audioToggle = document.getElementById('audio-toggle');

function toggleMute() {
  if (video.muted) {
    video.muted = false;
    audioToggle.textContent = "🔊 Mute Video";
  } else {
    video.muted = true;
    audioToggle.textContent = "🔇 Unmute Video";
  }
}

// Execute parsing logic on load
window.addEventListener('DOMContentLoaded', getWishData);
</script>
</body>
</html>
