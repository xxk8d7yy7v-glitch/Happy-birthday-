<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Dreamy Wish</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #ff5c8a; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #ffb3c6;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 16px;
        }
        textarea:focus { outline: none; border-color: #ff5c8a; }
        .suggestions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .tag {
            background: #fff;
            border: 1px solid #ffb3c6;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #ff5c8a;
            transition: 0.3s;
        }
        .tag:hover { background: #ff5c8a; color: white; }
        button {
            background: #ff5c8a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 92, 138, 0.4);
        }
        button:hover { background: #ff477e; transform: translateY(-2px); }
        #outputLink {
            margin-top: 20px;
            padding: 10px;
            background: #fff;
            border-radius: 10px;
            border: 1px dashed #ff5c8a;
            word-break: break-all;
            display: none;
        }
        a { color: #ff477e; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Create a Magical Wish ✨</h2>
    <p>Type a custom message or pick a template below:</p>
    
    <textarea id="wishMessage" placeholder="Type your birthday or anniversary wish here..."></textarea>
    
    <div class="suggestions">
        <span class="tag" onclick="setTemplate('Happy Birthday! May your day be as bright and beautiful as a cherry blossom tree in full bloom! 🌸')">🎂 Birthday</span>
        <span class="tag" onclick="setTemplate('Happy Anniversary! May your love continue to grow stronger and more beautiful with every passing year. 💕')">💑 Anniversary</span>
        <span class="tag" onclick="setTemplate('Just a little reminder that you are deeply loved and appreciated. Have a magical day! ✨')">🌸 Just Because</span>
    </div>
    
    <button onclick="generateLink()">Generate Magical Link</button>
    
    <div id="outputLink">
        <p>Share this link with them: 🎉</p>
        <a id="shareableUrl" href="#" target="_blank"></a>
    </div>
</div>

<script>
    function setTemplate(text) {
        document.getElementById('wishMessage').value = text;
    }

    function generateLink() {
        const message = document.getElementById('wishMessage').value;
        if (!message.trim()) {
            alert("Please enter or pick a wish first!");
            return;
        }
        
        // Encode the message safely into Base64 format
        const encodedMessage = btoa(unescape(encodeURIComponent(message)));
        
        // Get current page URL path and swap index.html for wish.html
        let currentUrl = window.location.href.split('?')[0];
        if (currentUrl.endsWith('index.html')) {
            currentUrl = currentUrl.replace('index.html', 'wish.html');
        } else if (currentUrl.endsWith('/')) {
            currentUrl += 'wish.html';
        } else {
            currentUrl += '/wish.html';
        }
        
        const finalUrl = `${currentUrl}?msg=${encodedMessage}`;
        
        const outputDiv = document.getElementById('outputLink');
        const linkAnchor = document.getElementById('shareableUrl');
        
        linkAnchor.href = finalUrl;
        linkAnchor.innerText = finalUrl;
        outputDiv.style.display = 'block';
    }
</script>
</body>
</html>
